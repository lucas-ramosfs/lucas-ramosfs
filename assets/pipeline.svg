<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img">
<title>Deploy pipeline resolving an incident</title>
<style>
  .bx{fill:#101c2b;stroke:#23405c;stroke-width:1.4}
  .pn{fill:#0c1622;stroke:#1e3448;stroke-width:1.2}
  .nm{fill:#8fb2cb;font:600 14px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
  .mn{fill:#6d90ac;font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .hd{fill:#a8c4da;font:600 13px ui-sans-serif,-apple-system,Segoe UI,sans-serif}
  .cage{fill:none;stroke:#2a4a68;stroke-width:1.4;stroke-dasharray:5 4}
  .pod{fill:#14332a;stroke:#2f8f6f;stroke-width:1.4}
  .w{stroke:#23405c;stroke-width:2;fill:none;stroke-dasharray:6 8;animation:fl 1.1s linear infinite}
  .tr{stroke:#4fc3e8;fill:none;stroke-dasharray:6 8;stroke-width:2;animation:fl 1.1s linear infinite}
  .gd{stroke:#1c2c3e;stroke-width:1}

  @keyframes fl{to{stroke-dashoffset:-14}}
  @keyframes lit{0%,2%{stroke:#23405c;fill:#101c2b}4%,12%{stroke:#ff9f4a;fill:#1b2733}16%,100%{stroke:#23405c;fill:#101c2b}}
  @keyframes litT{0%,2%{fill:#8fb2cb}4%,12%{fill:#ffd166}16%,100%{fill:#8fb2cb}}
  @keyframes ride{0%{transform:translateX(0);opacity:0}3%{opacity:1}28%{opacity:1}32%,100%{transform:translateX(470px);opacity:0}}
  @keyframes ap{0%,30%{opacity:0}34%,100%{opacity:1}}
  @keyframes r1{0%,42%{fill:#14332a;stroke:#2f8f6f}46%,50%{fill:#3a2a12;stroke:#e0a83c}54%,100%{fill:#1d5442;stroke:#63e6a4}}
  @keyframes r2{0%,54%{fill:#14332a;stroke:#2f8f6f}58%,62%{fill:#3a2a12;stroke:#e0a83c}66%,100%{fill:#1d5442;stroke:#63e6a4}}
  @keyframes r3{0%,66%{fill:#14332a;stroke:#2f8f6f}70%,74%{fill:#3a2a12;stroke:#e0a83c}78%,100%{fill:#1d5442;stroke:#63e6a4}}
  @keyframes f1{0%,42%{opacity:.9;stroke-width:2}46%,52%{opacity:.08;stroke-width:2}56%,100%{opacity:.9;stroke-width:2}}
  @keyframes f2{0%,54%{opacity:.9;stroke-width:2}58%,64%{opacity:.08;stroke-width:2}68%,100%{opacity:.9;stroke-width:2}}
  @keyframes f3{0%,66%{opacity:.9;stroke-width:2}70%,76%{opacity:.08;stroke-width:2}80%,100%{opacity:.9;stroke-width:2}}
  @keyframes draw{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
  @keyframes flip{0%,38%{fill:#3a2a12;stroke:#e0a83c}44%,80%{fill:#11293b;stroke:#4fc3e8}86%,100%{fill:#14332a;stroke:#2f8f6f}}
  @keyframes outT{0%,38%{opacity:1}44%,100%{opacity:0}}
  @keyframes midT{0%,38%{opacity:0}44%,80%{opacity:1}86%,100%{opacity:0}}
  @keyframes inT{0%,80%{opacity:0}86%,100%{opacity:1}}
  @keyframes dotC{0%,38%{fill:#e0a83c}44%,80%{fill:#4fc3e8}86%,100%{fill:#63e6a4}}
  @keyframes tp{0%,30%{clip-path:inset(0 100% 0 0)}38%,100%{clip-path:inset(0 0 0 0)}}
  @keyframes ap2{0%,42%{opacity:0}46%,100%{opacity:1}}
  @keyframes ap3{0%,52%{opacity:0}56%,100%{opacity:1}}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes puls{0%,100%{opacity:.3}50%{opacity:1}}

  #b1{animation:lit 14s infinite}#b2{animation:lit 14s infinite 1.4s}
  #b3{animation:lit 14s infinite 2.8s}#b4{animation:lit 14s infinite 4.2s}
  #t1{animation:litT 14s infinite}#t2{animation:litT 14s infinite 1.4s}
  #t3{animation:litT 14s infinite 2.8s}#t4{animation:litT 14s infinite 4.2s}
  #dot{animation:ride 14s linear infinite}
  #ty{animation:tp 14s steps(20) infinite}#ln2{animation:ap2 14s infinite}#ln3{animation:ap3 14s infinite}
  #cur{animation:bl 1s steps(1) infinite}
  #p1{animation:r1 14s infinite}#p2{animation:r2 14s infinite}#p3{animation:r3 14s infinite}
  #tr1{animation:fl 1.1s linear infinite,f1 14s infinite}
  #tr2{animation:fl 1.1s linear infinite,f2 14s infinite}
  #tr3{animation:fl 1.1s linear infinite,f3 14s infinite}
  #lat{animation:draw 14s linear infinite}
  #dpl,#dplT{animation:ap 14s infinite 3.4s}
  #sp1,#sp2,#sp3{animation:flip 14s infinite}
  #sOld{animation:outT 14s infinite}#sMid{animation:midT 14s infinite}#sNew{animation:inT 14s infinite}
  #blip{animation:puls 2s ease-in-out infinite,dotC 14s infinite}

  @media (prefers-color-scheme:light){
    .bx{fill:#f2f6fa;stroke:#b9cfe2}.pn{fill:#f7fafc;stroke:#cddeeb}
    .nm{fill:#2c536f}.mn{fill:#6b8ba5}.hd{fill:#1f4763}
    .cage{stroke:#b9cfe2}.pod{fill:#e8f6f0;stroke:#4aa383}
    .w{stroke:#b9cfe2}.gd{stroke:#dde7ef}
  }
</style>

<line class="w" x1="148" y1="50" x2="166" y2="50"/>
<line class="w" x1="296" y1="50" x2="314" y2="50"/>
<line class="w" x1="444" y1="50" x2="462" y2="50"/>

<g><rect id="b1" class="bx" x="20" y="24" width="128" height="52" rx="9"/>
<text id="t1" class="nm" x="84" y="46" text-anchor="middle">git push</text>
<text class="mn" x="84" y="64" text-anchor="middle">main</text></g>

<g><rect id="b2" class="bx" x="168" y="24" width="128" height="52" rx="9"/>
<text id="t2" class="nm" x="232" y="46" text-anchor="middle">build</text>
<text class="mn" x="232" y="64" text-anchor="middle">docker</text></g>

<g><rect id="b3" class="bx" x="316" y="24" width="128" height="52" rx="9"/>
<text id="t3" class="nm" x="380" y="46" text-anchor="middle">test</text>
<text class="mn" x="380" y="64" text-anchor="middle">ci + scan</text></g>

<g><rect id="b4" class="bx" x="464" y="24" width="150" height="52" rx="9"/>
<text id="t4" class="nm" x="539" y="46" text-anchor="middle">deploy</text>
<text class="mn" x="539" y="64" text-anchor="middle">terraform apply</text></g>

<line class="w" x1="614" y1="50" x2="630" y2="50"/>
<rect class="pn" x="632" y="12" width="248" height="88" rx="9"/>
<line x1="632" y1="34" x2="880" y2="34" class="gd"/>
<circle cx="646" cy="23" r="3.2" fill="#c9524f"/><circle cx="657" cy="23" r="3.2" fill="#d8a53c"/><circle cx="668" cy="23" r="3.2" fill="#5cbd8a"/>
<text class="mn" x="872" y="27" text-anchor="end" style="font-size:9px">bash</text>
<g id="ty"><text class="mn" x="642" y="52" style="font-size:10px"><tspan fill="#63e6a4">~ $</tspan> terraform apply</text></g>
<text id="ln2" opacity="0" class="mn" x="642" y="68" style="font-size:10px">Plan: 3 to add, 1 to change</text>
<text id="ln3" opacity="0" class="mn" x="642" y="84" style="font-size:10px"><tspan fill="#63e6a4">Apply complete.</tspan> 4 resources.</text>
<rect id="cur" x="642" y="90" width="7" height="2.5" fill="#ff9f4a"/>
<g id="dot"><circle cx="148" cy="50" r="6" fill="#ff9f4a"/></g>

<rect class="cage" x="20" y="106" width="466" height="150" rx="13"/>
<text class="hd" x="36" y="128">Amazon EKS</text>
<text class="mn" x="146" y="128">rolling update · maxUnavailable 1</text>

<rect class="bx" x="40" y="176" width="96" height="34" rx="8"/>
<text class="mn" x="88" y="197" text-anchor="middle">service</text>

<path id="tr1" class="tr" d="M136 193 C 200 193, 210 156, 268 156"/>
<path id="tr2" class="tr" d="M136 193 L 268 193"/>
<path id="tr3" class="tr" d="M136 193 C 200 193, 210 230, 268 230"/>

<rect id="p1" class="pod" x="272" y="142" width="192" height="28" rx="8"/>
<text class="mn" x="368" y="160" text-anchor="middle">pod · 1</text>
<rect id="p2" class="pod" x="272" y="179" width="192" height="28" rx="8"/>
<text class="mn" x="368" y="197" text-anchor="middle">pod · 2</text>
<rect id="p3" class="pod" x="272" y="216" width="192" height="28" rx="8"/>
<text class="mn" x="368" y="234" text-anchor="middle">pod · 3</text>

<rect class="pn" x="506" y="106" width="374" height="150" rx="13"/>
<text class="hd" x="522" y="128">p95 latency</text>
<text class="mn" x="612" y="128">observability</text>
<line x1="522" y1="238" x2="864" y2="238" class="gd"/>
<line x1="522" y1="196" x2="864" y2="196" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="3 5"/>
<text class="mn" x="864" y="192" text-anchor="end" style="font-size:10px">slo</text>
<polyline id="lat" points="522,158 560,152 598,162 636,154 674,160 712,157 748,177 784,195 820,208 864,218"
  fill="none" stroke="#4fc3e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="700"/>
<line id="dpl" opacity="0" x1="712" y1="140" x2="712" y2="238" stroke="#ff9f4a" stroke-width="1" stroke-dasharray="3 4"/>
<text id="dplT" opacity="0" class="mn" x="718" y="150" style="fill:#ff9f4a;font-size:10px">deploy</text>

<rect class="pn" x="20" y="278" width="860" height="86" rx="13"/>
<text class="mn" x="40" y="304">incident · elevated p95 latency</text>
<text id="sOld" class="hd" x="40" y="336" style="font-size:20px;fill:#e0a83c">degraded</text>
<text id="sMid" opacity="0" class="hd" x="40" y="336" style="font-size:20px;fill:#4fc3e8">monitoring</text>
<text id="sNew" opacity="0" class="hd" x="40" y="336" style="font-size:20px;fill:#63e6a4">resolved</text>

<text class="mn" x="470" y="314" text-anchor="middle">api</text>
<rect id="sp1" fill="#3a2a12" stroke="#e0a83c" x="430" y="322" width="80" height="16" rx="8" stroke-width="1.4"/>
<text class="mn" x="590" y="314" text-anchor="middle">database</text>
<rect id="sp2" fill="#3a2a12" stroke="#e0a83c" x="550" y="322" width="80" height="16" rx="8" stroke-width="1.4"/>
<text class="mn" x="710" y="314" text-anchor="middle">scheduler</text>
<rect id="sp3" fill="#3a2a12" stroke="#e0a83c" x="670" y="322" width="80" height="16" rx="8" stroke-width="1.4"/>
<circle id="blip" cx="840" cy="330" r="5" fill="#63e6a4"/>
</svg>
