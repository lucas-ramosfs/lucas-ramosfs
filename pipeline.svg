<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img">
<title>CI/CD pipeline</title>
<style>
  .box  { fill:#101c2b; stroke:#23405c; stroke-width:1.5; }
  .name { fill:#8fb2cb; font:600 15px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  .sub  { fill:#5b7d99; font:400 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .wire { stroke:#23405c; stroke-width:2; fill:none; stroke-dasharray:6 8; animation:flow 1.1s linear infinite; }
  .pod  { fill:#14332a; stroke:#2f8f6f; stroke-width:1.5; }

  @keyframes flow { to { stroke-dashoffset:-14; } }
  @keyframes lit {
    0%,3%    { stroke:#23405c; fill:#101c2b; }
    8%,20%   { stroke:#ff9f4a; fill:#1b2733; }
    27%,100% { stroke:#23405c; fill:#101c2b; }
  }
  @keyframes litText {
    0%,3%    { fill:#8fb2cb; }
    8%,20%   { fill:#ffd166; }
    27%,100% { fill:#8fb2cb; }
  }
  @keyframes ride {
    0%   { transform:translateX(0);    opacity:0; }
    4%   { opacity:1; }
    88%  { opacity:1; }
    92%  { transform:translateX(548px); opacity:0; }
    100% { transform:translateX(548px); opacity:0; }
  }
  @keyframes beat {
    0%,60%,100% { fill:#14332a; stroke:#2f8f6f; }
    70%,85%     { fill:#1d5442; stroke:#63e6a4; }
  }
  #b1 { animation:lit 7s infinite; }
  #b2 { animation:lit 7s infinite 1.05s; }
  #b3 { animation:lit 7s infinite 2.1s; }
  #b4 { animation:lit 7s infinite 3.15s; }
  #t1 { animation:litText 7s infinite; }
  #t2 { animation:litText 7s infinite 1.05s; }
  #t3 { animation:litText 7s infinite 2.1s; }
  #t4 { animation:litText 7s infinite 3.15s; }
  #dot { animation:ride 7s linear infinite; }
  #p1 { animation:beat 7s infinite 4.2s; }
  #p2 { animation:beat 7s infinite 4.4s; }
  #p3 { animation:beat 7s infinite 4.6s; }

  @media (prefers-color-scheme: light) {
    .box  { fill:#f2f6fa; stroke:#b9cfe2; }
    .name { fill:#2c536f; }
    .sub  { fill:#6b8ba5; }
    .wire { stroke:#b9cfe2; }
    .pod  { fill:#e8f6f0; stroke:#4aa383; }
  }
</style>

<line class="wire" x1="152" y1="78" x2="188" y2="78"/>
<line class="wire" x1="322" y1="78" x2="358" y2="78"/>
<line class="wire" x1="492" y1="78" x2="528" y2="78"/>
<line class="wire" x1="662" y1="78" x2="698" y2="78"/>

<g><rect id="b1" class="box" x="20" y="48" width="132" height="60" rx="10"/>
<text id="t1" class="name" x="86" y="74" text-anchor="middle">git push</text>
<text class="sub" x="86" y="93" text-anchor="middle">main</text></g>

<g><rect id="b2" class="box" x="190" y="48" width="132" height="60" rx="10"/>
<text id="t2" class="name" x="256" y="74" text-anchor="middle">build</text>
<text class="sub" x="256" y="93" text-anchor="middle">docker</text></g>

<g><rect id="b3" class="box" x="360" y="48" width="132" height="60" rx="10"/>
<text id="t3" class="name" x="426" y="74" text-anchor="middle">test + scan</text>
<text class="sub" x="426" y="93" text-anchor="middle">ci</text></g>

<g><rect id="b4" class="box" x="530" y="48" width="132" height="60" rx="10"/>
<text id="t4" class="name" x="596" y="74" text-anchor="middle">deploy</text>
<text class="sub" x="596" y="93" text-anchor="middle">terraform</text></g>

<g><rect class="box" x="700" y="48" width="180" height="60" rx="10"/>
<text class="name" x="790" y="72" text-anchor="middle">Amazon EKS</text>
<rect id="p1" class="pod" x="736" y="82" width="28" height="14" rx="4"/>
<rect id="p2" class="pod" x="776" y="82" width="28" height="14" rx="4"/>
<rect id="p3" class="pod" x="816" y="82" width="28" height="14" rx="4"/></g>

<g id="dot"><circle cx="152" cy="78" r="6" fill="#ff9f4a"/></g>

<text class="sub" x="20" y="150">commit</text>
<text class="sub" x="838" y="150" text-anchor="end">production</text>
<line x1="80" y1="146" x2="790" y2="146" stroke="#23405c" stroke-width="1" stroke-dasharray="2 6"/>
</svg>
